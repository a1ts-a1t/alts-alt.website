name: "Deploy website to hosts"

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  NODE_ENV: "production"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build # PUBLIC_TARGET=neocities → static dist/
      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: dist/
          if-no-files-found: error
          overwrite: true

  build-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build:server # PUBLIC_TARGET=vps → dist/server/entry.mjs + dist/client/
      - uses: actions/upload-artifact@v4
        with:
          name: server
          path: |
            dist/
            package.json
            package-lock.json
          if-no-files-found: error
          overwrite: true

  deploy-neocities:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - uses: bcomnes/deploy-to-neocities@v2
        with:
          api_token: ${{ secrets.NEOCITIES_API_TOKEN }}
          cleanup: true
          dist_dir: build

  deploy-alts-alt:
    needs: build-server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - name: Initialize ssh
        run: |
          install -m 600 -D /dev/null ~/.ssh/id_rsa
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.HOST_NAME }} > ~/.ssh/known_hosts
      - name: Sync server bundle
        run: rsync -av --delete server ${{ secrets.USERNAME }}@${{ secrets.HOST_NAME }}:~/alts-alt
      - name: Restart server
        run: ssh ${{ secrets.USERNAME }}@${{ secrets.HOST_NAME }} "~/alts-alt/entrypoint.sh"
